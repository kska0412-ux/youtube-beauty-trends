name: 収集

on:
  # JST 6:00（GitHub Actions の cron は UTC なので 21:00 UTC を指定する）
  schedule:
    - cron: '0 21 * * *'
  # 手動実行。Actions タブの「Run workflow」から今すぐ走らせられる
  workflow_dispatch:

# データを自動コミットするので書き込み権限が要る
permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: 依存パッケージをインストール
        run: pip install -r collector/requirements.txt

      - name: 収集を実行
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python collector/collect.py

      - name: 差分があればコミットする
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "データに差分が無いのでコミットしません"
          else
            git commit -m "データ更新: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') JST"
            git push
          fi
