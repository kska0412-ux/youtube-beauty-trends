# 検索キーワード辞書
#
# Threads / Instagram のリサーチツールと同じ構成にしてある。
#
#   genres    … 主ジャンル。単独で検索して意味が通る語だけを置く。1ジャンル1語。
#   modifiers … 掛け合わせ語。単独では検索しない。
#               「経営」「メニュー」を単独で検索すると飲食店や一般ビジネスの動画を
#               大量に拾う（Threads版の実測で31件中23件＝74%が無関係だった）。
#               そこで combine_with に挙げた主ジャンルと組ませた語だけを検索する。
#               YouTube の検索は空白がANDなので、組ませるだけで絞り込める。
#               例:「エステティシャン 経営」「ヘッドスパ メニュー」
#
# 編集のしかた
#   - 主ジャンルを足す : genres: の下に「  ジャンル名:」の行と、その下に
#                        「    - 検索語」の行を書く（空白は2つ・4つ）
#   - 掛け合わせを足す : modifiers: の下に「  語:」と、組ませたい主ジャンルを
#                        「    - ジャンル名」で並べる
#   - 一時的に止める   : その行の頭に「#」を付ける
#
# 消費ユニットの目安（1日の上限は10,000）
#   検索1語 = 100ユニット
#   いまの構成 = 主ジャンル39 + 掛け合わせ42 = 81語
#   1日に検索するのは60語まで（6,000ユニット）。60語を超えた分はその日は検索されず、
#   翌日以降に回る（日替わりローテーション。81語なら約1.4日で一周）
#   これに動画詳細とチャンネル情報が最大120ユニット乗って、最悪 6,120ユニット/日
#   検索しなかった語の動画は前日の videos.json から持ち越すので、ページからは消えない

# 外したジャンル:
#   パーマネントジュエリー … 2026-09-03 の実測で、90日以内の日本語動画が0件だった。
#     単独検索50件は全て英語圏のチャンネルで、「パーマネントジュエリー 高単価」
#     「〜 スクール」は YouTube が1本も返さなかった（打ち切りではなく該当なし）。
#     YouTube にまだ日本語の供給が無いジャンル。復活させるときはこのブロックと
#     required_any、modifiers の combine_with の3か所に戻すこと。

