# exclude: 除外語
#   タイトルかチャンネル名にこの語が入っていたら、業界の動画ではないとみなして捨てる。
#   実データで確認したうえで、巻き込み事故が起きない語だけを入れてある。
#
#   あえて入れていない語:
#     ASMR  … 「benio店長」など本物のヘッドスパ動画が47件消えるため
#     vlog  … 現役エステティシャンの発信が消えるため
#     コント … 「脊柱コントロール」「にこ鍼灸院」まで巻き込むため（部分一致のため）
#   語を足すときは、部分一致で他の語を巻き込まないか必ず確かめること。

exclude:
  アニメ・二次創作:
    - クレヨンしんちゃん
    - 野原しんのすけ
  作り話・切り抜き:
    - ショートドラマ
    - ショートコント
    - 切り抜き
  音楽・ゲーム:
    - 歌ってみた
    - ゲーム実況
    - 替え歌
